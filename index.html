<!DOCTYPE html><html lang="el"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex, nofollow"><meta name="description" content="Dev preview - redesign proposal for AZ Clean. Not the live site."><title>AZ Clean — Πρόταση Ανασχεδιασμού</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500;1,6..72,600&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --ink:#15130E;
  --ink-soft:#2A241A;
  --paper:#FFFFFF;
  --linen:#F5F1E8;
  --linen-deep:#EAE2D0;
  --gold-deep:#8A6214;
  --gold:#B8860B;
  --gleam:#D4A017;
  --clay:#5A4632;
  --line:rgba(21,19,14,.13);
  --line-soft:rgba(21,19,14,.08);
  --text:#15130E;
  --text-70:rgba(21,19,14,.68);
  --text-45:rgba(21,19,14,.46);
  --surface:#FFFFFF;
  --surface-sunk:#F5F1E8;
  --on-dark:#F5F1E8;
  --on-dark-70:rgba(245,241,232,.72);
  --on-dark-45:rgba(245,241,232,.46);
  --dark-surface:#15130E;
  --dark-surface-raise:#211C14;
  --shadow-1:0 1px 2px rgba(21,15,4,.08),0 8px 22px -10px rgba(21,15,4,.22);
  --shadow-2:0 4px 10px rgba(21,15,4,.12),0 26px 60px -20px rgba(21,15,4,.34);
  --ease:cubic-bezier(.22,.61,.36,1);
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#F5F1E8;
    --paper:#1A160F;
    --linen:#15130E;
    --linen-deep:#211C14;
    --gold-deep:#D9A93B;
    --gold:#E3B84F;
    --gleam:#F0C64B;
    --clay:#C9B79C;
    --line:rgba(245,241,232,.16);
    --line-soft:rgba(245,241,232,.09);
    --text:#F1ECDF;
    --text-70:rgba(241,236,223,.72);
    --text-45:rgba(241,236,223,.48);
    --surface:#1E1911;
    --surface-sunk:#15130E;
    --on-dark:#F5F1E8;
    --on-dark-70:rgba(245,241,232,.72);
    --on-dark-45:rgba(245,241,232,.46);
    --dark-surface:#0E0C08;
    --dark-surface-raise:#191510;
    --shadow-1:0 1px 2px rgba(0,0,0,.35),0 8px 22px -10px rgba(0,0,0,.5);
    --shadow-2:0 4px 10px rgba(0,0,0,.4),0 26px 60px -20px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ink:#F5F1E8;
  --paper:#1A160F;
  --linen:#15130E;
  --linen-deep:#211C14;
  --gold-deep:#D9A93B;
  --gold:#E3B84F;
  --gleam:#F0C64B;
  --clay:#C9B79C;
  --line:rgba(245,241,232,.16);
  --line-soft:rgba(245,241,232,.09);
  --text:#F1ECDF;
  --text-70:rgba(241,236,223,.72);
  --text-45:rgba(241,236,223,.48);
  --surface:#1E1911;
  --surface-sunk:#15130E;
  --on-dark:#F5F1E8;
  --on-dark-70:rgba(245,241,232,.72);
  --on-dark-45:rgba(245,241,232,.46);
  --dark-surface:#0E0C08;
  --dark-surface-raise:#191510;
  --shadow-1:0 1px 2px rgba(0,0,0,.35),0 8px 22px -10px rgba(0,0,0,.5);
  --shadow-2:0 4px 10px rgba(0,0,0,.4),0 26px 60px -20px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--linen);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px}
@media(max-width:640px){.wrap{padding:0 20px}}
a{color:inherit}
.eyebrow{font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-deep)}
.serif{font-family:var(--serif)}
h1,h2,h3{font-family:var(--serif);letter-spacing:-.01em;text-wrap:balance}
.h1{font-size:clamp(40px,7vw,80px);font-weight:600;line-height:1.02;letter-spacing:-.02em}
.h1 em{font-style:italic;color:var(--gold-deep);font-weight:500}
.h2{font-size:clamp(30px,4.4vw,46px);font-weight:600;line-height:1.08}
.h3{font-size:clamp(20px,2.2vw,24px);font-weight:600;line-height:1.25;font-family:var(--sans);letter-spacing:-.01em}
.lede{font-size:clamp(18px,2.1vw,22px);color:var(--text-70);max-width:44ch;line-height:1.5}
.lede.on-dark{color:var(--on-dark-70)}
::selection{background:var(--gleam);color:#15130E}
:focus-visible{outline:3px solid var(--gold-deep);outline-offset:3px;border-radius:2px}

/* header */
header{position:sticky;top:0;z-index:50;background:color-mix(in srgb, var(--linen) 88%, transparent);backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid var(--line-soft)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 0}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit}
.mark{width:38px;height:38px;border-radius:8px;background:linear-gradient(155deg,#25200F,#0E0C08);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-1);flex:0 0 38px}
.mark span{font-family:var(--serif);font-style:italic;font-weight:600;color:var(--gleam);font-size:17px}
.bn{display:flex;flex-direction:column;line-height:1.14}
.bn b{font-size:16px;font-weight:800;letter-spacing:-.01em;font-family:var(--sans)}
.bn small{font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text-45)}
.navlinks{display:flex;gap:30px;align-items:center}
.navlinks a{text-decoration:none;font-size:14px;font-weight:600;color:var(--text-70);position:relative;padding:4px 0}
.navlinks a:after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1.5px;background:var(--gold-deep);transform:scaleX(0);transition:transform .3s var(--ease)}
.navlinks a:hover{color:var(--text)}
.navlinks a:hover:after{transform:scaleX(1)}
.navlinks a.cta-link{color:var(--gold-deep)}
.telbtn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;font-size:14.5px;color:var(--text);border-bottom:2px solid var(--gold-deep);padding-bottom:2px;white-space:nowrap}
@media(max-width:980px){.navlinks{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:700;font-size:15px;padding:15px 26px;border-radius:3px;letter-spacing:-.01em;min-height:50px;border:1.5px solid transparent;transition:transform .12s var(--ease),background .2s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease);cursor:pointer;font-family:var(--sans)}
.btn:active{transform:translateY(1px)}
.btn-dark{background:var(--ink);color:var(--linen);box-shadow:var(--shadow-1)}
.btn-dark:hover{box-shadow:var(--shadow-2)}
:root[data-theme="dark"] .btn-dark, @media (prefers-color-scheme:dark){.btn-dark{color:#15130E}}
.btn-gold{background:transparent;border-color:var(--gold-deep);color:var(--gold-deep)}
.btn-gold:hover{background:var(--gold-deep);color:var(--linen)}
.btn-ghost{border-color:var(--line);color:var(--text)}
.btn-ghost:hover{border-color:var(--gold-deep);color:var(--gold-deep)}
.btn-onDark{border-color:rgba(245,241,232,.35);color:var(--on-dark)}
.btn-onDark:hover{background:rgba(245,241,232,.12);border-color:var(--on-dark)}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* hero */
.hero{padding:64px 0 88px}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
@media(max-width:940px){.hero-grid{grid-template-columns:1fr;gap:36px}.hero{padding:36px 0 56px}}
.hero-copy .eyebrow{margin-bottom:20px;display:block}
.hero h1{margin-bottom:22px}
.hero .lede{margin-bottom:32px}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:44px}
.hero-photo{position:relative;border-radius:6px;overflow:hidden;box-shadow:var(--shadow-2);aspect-ratio:4/5}
.hero-photo img{width:100%;height:100%;object-fit:cover}
.hero-photo .tag{position:absolute;left:18px;bottom:18px;background:rgba(21,19,14,.72);color:#F5F1E8;padding:8px 14px;border-radius:3px;font-size:12px;font-weight:700;letter-spacing:.04em;backdrop-filter:blur(6px)}
.facts{display:flex;flex-wrap:wrap;gap:28px 48px;padding-top:26px;border-top:1px solid var(--line)}
.fact b{display:block;font-size:19px;font-weight:800;font-family:var(--sans);letter-spacing:-.02em}
.fact span{font-size:12.5px;color:var(--text-45)}
.fact .stars{color:var(--gleam);letter-spacing:2px;font-size:15px}

/* sections */
section{padding:112px 0}
@media(max-width:820px){section{padding:72px 0}}
.shead{display:flex;align-items:baseline;gap:18px;margin-bottom:40px}
.shead .no{font-family:var(--serif);font-style:italic;font-size:clamp(26px,3.6vw,38px);font-weight:600;color:var(--gold-deep);opacity:.55;line-height:1}
.shead .label{font-size:11.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--text-45)}
.shead .rule{flex:1;height:1px;background:var(--line)}
.dark-section{background:var(--dark-surface);color:var(--on-dark)}
.dark-section .shead .label{color:var(--on-dark-45)}
.dark-section .shead .rule{background:rgba(245,241,232,.16)}
.dark-section .shead .no{color:var(--gleam);opacity:.85}

/* proof / slider */
.proof-note{color:var(--on-dark-45);font-size:12.5px;margin-top:36px}
.proof-main{margin-bottom:22px}
.proof-row{display:grid;grid-template-columns:1.1fr .9fr;gap:22px}
@media(max-width:760px){.proof-row{grid-template-columns:1fr}}
.cmp{position:relative;width:100%;overflow:hidden;touch-action:pan-y;cursor:ew-resize;background:#0E0C08;box-shadow:var(--shadow-2);border-radius:5px;user-select:none;-webkit-user-select:none;aspect-ratio:16/10}
.cmp.tall{aspect-ratio:4/5}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cmp .after-layer{clip-path:inset(0 0 0 var(--p,58%))}
.cmp .edge{position:absolute;top:0;bottom:0;pointer-events:none;left:clamp(1.5%,var(--p,58%),98.5%);width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 26px rgba(255,255,255,.5)}
.cmp .grip{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;pointer-events:none;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;gap:4px;transition:transform .16s var(--ease)}
.cmp.dragging .grip{transform:translate(-50%,-50%) scale(1.08)}
.cmp .grip i{width:2px;height:15px;background:#15130E;border-radius:2px}
.cmp .rng{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:ew-resize}
.cmp .tag{position:absolute;top:16px;padding:6px 12px;font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;pointer-events:none;border-radius:2px}
.cmp .tag.l{left:16px;background:rgba(30,22,10,.82);color:#EFE3D2}
.cmp .tag.r{right:16px;background:rgba(255,255,255,.92);color:#15130E}
.cmp .drag-hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.55);color:#fff;font-size:11.5px;font-weight:600;padding:7px 13px;border-radius:20px;pointer-events:none;transition:opacity .35s var(--ease)}
.cmp.touched .drag-hint{opacity:0}
.shot{position:relative;width:100%;aspect-ratio:4/5;border-radius:5px;overflow:hidden;box-shadow:var(--shadow-2)}
.shot img{width:100%;height:100%;object-fit:cover}
.shot .tag{position:absolute;top:16px;left:16px;background:rgba(255,255,255,.92);color:#15130E;padding:6px 12px;font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;border-radius:2px}
.cap{margin-top:14px;font-size:14px;color:var(--on-dark-70)}
.cap b{display:block;color:var(--on-dark);font-size:15.5px;font-family:var(--sans);letter-spacing:-.01em;margin-bottom:2px}
.stat-panel{position:relative;width:100%;aspect-ratio:4/5;border-radius:5px;overflow:hidden;box-shadow:var(--shadow-2);background:linear-gradient(150deg,var(--gold-deep),var(--gleam));color:#15130E;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:34px}
.stat-panel .stars{color:#15130E;letter-spacing:3px;font-size:17px;opacity:.72}
.stat-panel .num{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(44px,6vw,58px);line-height:1}
.stat-panel p{font-size:14.5px;font-weight:600;max-width:22ch;line-height:1.5}

/* services */
.split{display:grid;grid-template-columns:.62fr 1.38fr;gap:64px}
@media(max-width:940px){.split{grid-template-columns:1fr;gap:32px}}
.sticky-lede{position:sticky;top:100px;align-self:start}
@media(max-width:940px){.sticky-lede{position:static}}
.svcgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
@media(max-width:640px){.svcgrid{grid-template-columns:1fr}}
.svc{background:var(--surface);padding:26px}
.svc b{display:block;font-size:15.5px;font-weight:700;margin-bottom:7px;letter-spacing:-.01em;font-family:var(--sans)}
.svc span{font-size:13.5px;color:var(--text-70);line-height:1.55}

/* steps */
.steps{display:grid;gap:36px;counter-reset:st}
.step{display:grid;grid-template-columns:52px 1fr;gap:18px}
.step .num{font-family:var(--serif);font-style:italic;font-size:30px;font-weight:600;color:var(--gold-deep);opacity:.55;line-height:1.1}
.step h3{margin-bottom:6px}
.step p{color:var(--text-70);font-size:15.5px;max-width:60ch}

/* process cards (photo + overlapping label, azclean.ca-style) */
.pcards{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
@media(max-width:820px){.pcards{grid-template-columns:1fr;gap:32px}}
.pcard-media{position:relative;aspect-ratio:4/5;border-radius:8px;overflow:hidden;box-shadow:var(--shadow-2);margin-bottom:20px}
.pcard-media img{width:100%;height:100%;object-fit:cover}
.pcard-media.solid{background:linear-gradient(150deg,var(--gold-deep),var(--gleam));display:flex;align-items:center;justify-content:center}
.pcard-media.solid .pcard-glyph{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(56px,7vw,74px);color:#15130E;opacity:.85}
.pcard-tab{position:absolute;left:16px;bottom:16px;background:var(--ink);color:var(--linen);padding:9px 15px;border-radius:4px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;box-shadow:var(--shadow-1)}
.pcard-media.solid .pcard-tab{background:rgba(21,19,14,.88)}
.pcard h3{margin-bottom:6px}
.pcard p{color:var(--text-70);font-size:15px;max-width:42ch}

/* final CTA — full-bleed gold band */
.cta-gold{background:linear-gradient(120deg,var(--gold-deep),var(--gleam))}
.cta-gold-inner{padding:80px 28px;display:grid;grid-template-columns:1.2fr .8fr;gap:56px;align-items:center;max-width:1240px;margin:0 auto}
@media(max-width:940px){.cta-gold-inner{grid-template-columns:1fr;padding:56px 20px;gap:28px}}
.cta-gold *{color:#15130E}
.cta-gold .eyebrow{color:#15130E;opacity:.62}
.cta-gold p{opacity:.78;margin-top:12px;max-width:48ch;font-weight:500}
.cta-gold .acts{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap}
.cta-gold .btn-dark{background:#15130E;color:#F5F1E8!important}
.cta-gold .btn-dark *{color:#F5F1E8!important}
.cta-gold .btn-ghost{border-color:rgba(21,19,14,.4)}
.cta-gold .btn-ghost:hover{background:rgba(21,19,14,.1)}
.cta-gold .sched b{display:block;font-weight:800;margin:14px 0 6px}

/* boat band */
.band{background:var(--dark-surface);color:var(--on-dark)}
.band .wrap{padding:96px 28px}
@media(max-width:820px){.band .wrap{padding:64px 20px}}
.band-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:64px;align-items:start;margin-top:36px}
@media(max-width:940px){.band-grid{grid-template-columns:1fr;gap:32px}}
.band ul{list-style:none;display:grid;gap:0}
.band li{padding:16px 0;border-top:1px solid rgba(245,241,232,.15);font-size:15.5px;color:var(--on-dark-70)}
.band li:last-child{border-bottom:1px solid rgba(245,241,232,.15)}
.band-photo{border-radius:5px;overflow:hidden;box-shadow:var(--shadow-2)}

/* booking */
.booking-wrap{display:grid;grid-template-columns:1fr 1.15fr;gap:56px;align-items:start}
@media(max-width:940px){.booking-wrap{grid-template-columns:1fr;gap:32px}}
.booking-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-1);padding:32px}
.demo-flag{display:inline-flex;align-items:center;gap:8px;background:var(--linen-deep);border:1px solid var(--line);color:var(--clay);font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:7px 12px;border-radius:20px;margin-bottom:22px}
.demo-flag i{width:6px;height:6px;border-radius:50%;background:var(--gold-deep)}
.bk-row{margin-bottom:22px}
.bk-row label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-45);margin-bottom:10px}
.bk-pills{display:flex;flex-wrap:wrap;gap:8px}
.bk-pill{padding:9px 15px;border:1.5px solid var(--line);border-radius:20px;font-size:13.5px;font-weight:600;background:var(--surface);color:var(--text-70);cursor:pointer;transition:border-color .18s var(--ease),color .18s var(--ease),background .18s var(--ease)}
.bk-pill:hover{border-color:var(--gold-deep)}
.bk-pill.active{background:var(--ink);border-color:var(--ink);color:var(--linen)}
.bk-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.bk-day{padding:10px 4px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;text-align:center;font-size:12.5px;font-weight:600;color:var(--text-70)}
.bk-day span{display:block;font-size:15px;font-weight:800;color:var(--text);margin-top:2px}
.bk-day.active{background:var(--ink);border-color:var(--ink);color:var(--linen)}
.bk-day.active span{color:var(--linen)}
.bk-day[disabled]{opacity:.35;cursor:not-allowed}
.bk-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:480px){.bk-slots{grid-template-columns:repeat(3,1fr)}}
.bk-slot{padding:10px 6px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;font-size:13px;font-weight:600;color:var(--text-70);font-variant-numeric:tabular-nums}
.bk-slot.active{background:var(--ink);border-color:var(--ink);color:var(--linen)}
.bk-summary{border-top:1px solid var(--line);margin-top:26px;padding-top:22px}
.bk-summary-row{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;color:var(--text-70)}
.bk-summary-row b{color:var(--text);font-weight:700}
.bk-confirm-msg{background:var(--linen-deep);border:1px solid var(--line);border-radius:6px;padding:18px 20px;font-size:13.5px;color:var(--clay);line-height:1.55;margin-top:18px}
.bk-side .h3{margin-bottom:14px}
.bk-side p{color:var(--text-70);font-size:15px;margin-bottom:22px;max-width:46ch}
.bk-side-card{display:flex;gap:14px;align-items:flex-start;padding:18px 0;border-top:1px solid var(--line)}
.bk-side-card:first-of-type{border-top:none}
.bk-side-card b{display:block;font-size:14.5px;margin-bottom:3px}
.bk-side-card span{font-size:13.5px;color:var(--text-70)}

/* testimonials */
.revs{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:22px}
.rev{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:26px;box-shadow:var(--shadow-1)}
.rev .st{color:var(--gleam);letter-spacing:2px;font-size:14px;margin-bottom:14px}
.rev p{font-size:15px;color:var(--text-70);margin-bottom:18px;line-height:1.6}
.rev .who{font-size:13px;font-weight:700}

/* areas / faq */
.two{display:grid;grid-template-columns:1fr 1fr;gap:64px}
@media(max-width:940px){.two{grid-template-columns:1fr;gap:40px}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border:1px solid var(--line);border-radius:2px;font-size:14px;color:var(--text-70);background:var(--surface)}
.chip.core{background:var(--ink);border-color:var(--ink);color:var(--linen);font-weight:700}
details{border-top:1px solid var(--line)}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{font-weight:700;font-size:16px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px;min-height:58px;align-items:center;font-family:var(--sans)}
summary::-webkit-details-marker{display:none}
summary:after{content:"";width:10px;height:10px;flex:0 0 10px;border-right:2px solid var(--gold-deep);border-bottom:2px solid var(--gold-deep);transform:rotate(45deg) translateY(-3px);transition:transform .25s var(--ease)}
details[open] summary:after{transform:rotate(-135deg) translateY(-2px)}
details p{color:var(--text-70);font-size:15.5px;padding-bottom:20px;max-width:60ch}

/* final cta */
.cta-band{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:56px;display:grid;grid-template-columns:1.2fr .8fr;gap:56px;align-items:center;box-shadow:var(--shadow-1)}
@media(max-width:940px){.cta-band{grid-template-columns:1fr;padding:32px;gap:28px}}
.cta-band p{color:var(--text-70);margin-top:12px;max-width:48ch}
.cta-band .acts{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap}

/* footer */
footer{background:var(--dark-surface);color:var(--on-dark-70);padding:64px 0 32px;font-size:14.5px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:32px;margin-bottom:40px}
footer .flabel{color:var(--on-dark-45);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-bottom:12px}
footer a{color:var(--on-dark);text-decoration:none}
footer a:hover{text-decoration:underline}
.fine{border-top:1px solid rgba(245,241,232,.15);padding-top:20px;font-size:12.5px;color:var(--on-dark-45);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

/* sticky mobile bar */
.stickybar{position:fixed;left:0;right:0;bottom:0;z-index:80;display:none;gap:8px;padding:10px;background:color-mix(in srgb, var(--linen) 92%, transparent);border-top:1px solid var(--line);backdrop-filter:blur(14px) saturate(1.3)}
.stickybar a,.stickybar button{flex:1;font-size:13.5px;padding:13px 8px;min-height:auto}
@media(max-width:940px){.stickybar{display:flex}body{padding-bottom:74px}}

.rv{opacity:0;transform:translateY(18px)}
.rv.in{opacity:1;transform:none;transition:opacity .8s var(--ease) var(--d,0ms),transform .8s var(--ease) var(--d,0ms)}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rv{opacity:1!important;transform:none!important}*{transition:none!important;animation:none!important}}

.dev-banner{background:var(--gold-deep);color:#15130E;text-align:center;font-size:13px;font-weight:700;padding:10px 16px;letter-spacing:.01em}
.dev-banner b{font-weight:800}
</style>

/* ---------- reveal-on-scroll ---------- */
function Rv({children, delay, className, tag}){
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if(!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if(e.isIntersecting){ setInView(true); io.unobserve(el); } });
    }, {threshold:.14});
    io.observe(el);
    return () => io.disconnect();
  }, []);
  const Tag = tag || "div";
  return h(Tag, {ref, className: "rv" + (inView ? " in" : "") + (className ? " " + className : ""), style: delay ? {"--d": delay+"ms"} : undefined}, children);
}

/* ---------- drag compare slider ---------- */
function Compare({before, after, tall, start, labelL, labelR}){
  const [p, setP] = useState(start || 58);
  const [dragging, setDragging] = useState(false);
  const [touched, setTouched] = useState(false);
  const ref = useRef(null);

  const setFromClientX = useCallback((clientX) => {
    const el = ref.current;
    if(!el) return;
    const r = el.getBoundingClientRect();
    let pct = ((clientX - r.left) / r.width) * 100;
    pct = Math.max(0, Math.min(100, pct));
    setP(pct);
    setTouched(true);
  }, []);

  useEffect(() => {
    if(!dragging) return;
    const move = (e) => { const x = e.touches ? e.touches[0].clientX : e.clientX; setFromClientX(x); };
    const up = () => setDragging(false);
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
    window.addEventListener("touchmove", move, {passive:true});
    window.addEventListener("touchend", up);
    return () => {
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
      window.removeEventListener("touchmove", move);
      window.removeEventListener("touchend", up);
    };
  }, [dragging, setFromClientX]);

  return h("div", {
    ref,
    className: "cmp" + (tall ? " tall" : "") + (dragging ? " dragging" : "") + (touched ? " touched" : ""),
    style: {"--p": p + "%"},
    onMouseDown: (e) => { setDragging(true); setFromClientX(e.clientX); },
    onTouchStart: (e) => { setDragging(true); setFromClientX(e.touches[0].clientX); },
  },
    h("img", {src: before, alt: labelL, loading:"lazy"}),
    h("img", {src: after, alt: labelR, className:"after-layer", loading:"lazy"}),
    h("input", {
      type:"range", className:"rng", min:0, max:100, value:Math.round(p),
      "aria-label": "Σύρετε για σύγκριση πριν και μετά",
      onChange: (e) => { setP(Number(e.target.value)); setTouched(true); }
    }),
    h("div", {className:"edge"}, h("div", {className:"grip"}, h("i"), h("i"))),
    h("span", {className:"tag l"}, labelL || "Πριν"),
    h("span", {className:"tag r"}, labelR || "Μετά"),
    h("span", {className:"drag-hint"}, "↔ Σύρετε")
  );
}

/* ---------- booking (Setmore-style demo) ---------- */
const BK_SERVICES = ["Καναπές","Στρώμα","Χαλί","Σκάφος","Αυτοκίνητο"];
function nextDays(n){
  const days = [];
  const dowShort = ["Κυρ","Δευ","Τρι","Τετ","Πεμ","Παρ","Σαβ"];
  const today = new Date();
  for(let i=0;i<n;i++){
    const d = new Date(today);
    d.setDate(today.getDate()+i);
    const dow = d.getDay();
    const closed = dow === 0;
    days.push({date:d, label:dowShort[dow], num:d.getDate(), closed});
  }
  return days;
}
function slotsFor(day){
  if(!day) return [];
  const dow = day.date.getDay();
  const isSat = dow === 6;
  const startH = isSat ? 9 : 8;
  const endH = isSat ? 18 : 21;
  const out = [];
  for(let hr=startH; hr<endH; hr++){ out.push(hr+":00"); if(hr!==endH-1) out.push(hr+":30"); }
  return out;
}
function Booking(){
  const days = nextDays(7);
  const [service, setService] = useState(null);
  const [day, setDay] = useState(null);
  const [slot, setSlot] = useState(null);
  const [confirmed, setConfirmed] = useState(false);
  const ready = service && day && slot;
  return h("section", {id:"kratisi"},
    h("div", {className:"wrap"},
      h(Rv, {className:"shead"}, h("span", {className:"no"}, "05"), h("span", {className:"label"}, "Κράτηση online"), h("span", {className:"rule"})),
      h("div", {className:"booking-wrap"},
        h(Rv, {className:"booking-card", delay:60},
          h("span", {className:"demo-flag"}, h("i"), "DEMO — δεν είναι συνδεδεμένο ακόμα"),
          h("div", {className:"bk-row"},
            h("label", null, "Τι θέλετε να καθαρίσουμε;"),
            h("div", {className:"bk-pills"},
              BK_SERVICES.map(s => h("button", {key:s, className:"bk-pill"+(service===s?" active":""), onClick:()=>{setService(s);setConfirmed(false);}}, s))
            )
          ),
          h("div", {className:"bk-row"},
            h("label", null, "Ημέρα"),
            h("div", {className:"bk-days"},
              days.map((d,i) => h("button", {
                key:i, disabled:d.closed, className:"bk-day"+(day===d?" active":""),
                onClick:()=>{setDay(d);setSlot(null);setConfirmed(false);}
              }, d.label, h("span", null, d.num)))
            )
          ),
          h("div", {className:"bk-row"},
            h("label", null, "Ώρα"),
            h("div", {className:"bk-slots"},
              (day ? slotsFor(day) : []).slice(0,12).map(s => h("button", {
                key:s, className:"bk-slot"+(slot===s?" active":""), onClick:()=>{setSlot(s);setConfirmed(false);}
              }, s))
            ),
            !day && h("p", {style:{fontSize:"13px",color:"var(--text-45)",marginTop:"8px"}}, "Διαλέξτε πρώτα ημέρα.")
          ),
          h("div", {className:"bk-summary"},
            h("div", {className:"bk-summary-row"}, h("span", null, "Υπηρεσία"), h("b", null, service || "—")),
            h("div", {className:"bk-summary-row"}, h("span", null, "Ημερομηνία"), h("b", null, day ? (day.label+" "+day.num) : "—")),
            h("div", {className:"bk-summary-row"}, h("span", null, "Ώρα"), h("b", null, slot || "—")),
            h("button", {
              className:"btn btn-dark btn-block", style:{marginTop:"18px"}, disabled:!ready,
              onClick:()=>setConfirmed(true)
            }, "Προεπισκόπηση κράτησης"),
